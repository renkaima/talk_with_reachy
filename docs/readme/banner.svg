<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" role="img" aria-label="Talk with Reachy: voice conversations with Reachy Mini, recorded for research. Who said what, when, and in which voice, saved to Google Drive.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3c49"/>
      <stop offset="1" stop-color="#16808d"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#ffffff">
    <text x="64" y="128" font-size="60" font-weight="700">Talk with Reachy</text>
    <text x="66" y="182" font-size="23" fill-opacity="0.92">Voice conversations with Reachy Mini, recorded for research.</text>
    <text x="66" y="218" font-size="23" fill-opacity="0.92">Who said what, when, and in which voice, saved to Google Drive.</text>
    <text x="66" y="268" font-size="16" fill-opacity="0.7" letter-spacing="1.5">AN APP FOR THE REACHY MINI ROBOT · BUILT FOR RESEARCH STUDIES</text>
  </g>

  <!-- A person's speech bubble with a sound wave -->
  <g transform="translate(860 52)">
    <rect width="250" height="82" rx="18" fill="#ffffff"/>
    <path d="M40 82 L36 104 L64 82 Z" fill="#ffffff"/>
    <g fill="#16808d">
      <rect x="30" y="34" width="8" height="14" rx="4"/>
      <rect x="46" y="24" width="8" height="34" rx="4"/>
      <rect x="62" y="16" width="8" height="50" rx="4"/>
      <rect x="78" y="28" width="8" height="26" rx="4"/>
      <rect x="94" y="20" width="8" height="42" rx="4"/>
      <rect x="110" y="32" width="8" height="18" rx="4"/>
    </g>
    <rect x="138" y="26" width="92" height="30" rx="15" fill="#e6f4f5"/>
    <text x="184" y="47" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#0b3c49" text-anchor="middle">P01</text>
  </g>

  <!-- Reachy's reply bubble -->
  <g transform="translate(990 150)">
    <rect width="230" height="66" rx="18" fill="#ffd166"/>
    <path d="M190 66 L198 88 L168 66 Z" fill="#ffd166"/>
    <circle cx="44" cy="33" r="7" fill="#0b3c49"/>
    <circle cx="70" cy="33" r="7" fill="#0b3c49"/>
    <circle cx="96" cy="33" r="7" fill="#0b3c49"/>
    <text x="196" y="40" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0b3c49" text-anchor="end">Reachy</text>
  </g>

  <!-- A transcript line with timing -->
  <g transform="translate(860 248)" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">
    <rect width="360" height="40" rx="10" fill="#0b3c49" fill-opacity="0.55"/>
    <text x="16" y="26" fill="#ffd166">00:12.4–00:15.1</text>
    <text x="172" y="26" fill="#ffffff">P01</text>
    <text x="214" y="26" fill="#ffffff" fill-opacity="0.8">"Hi Reachy!"</text>
  </g>
</svg>
